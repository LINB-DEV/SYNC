name: Build and attest release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Matching private source release tag
        required: true
        type: string
      source_sha:
        description: Full private source commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'LINB-DEV/SYNC-PUBLIC'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate release inputs
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Read private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LINB-DEV/SYNC-SOURCE
          ref: refs/tags/${{ inputs.version }}
          path: source
          ssh-key: ${{ secrets.SYNC_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source identity
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('plugin/manifest.json'));if(m.version!==process.env.RELEASE_VERSION||m.id!=='linb-sync')process.exit(1)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build without publishing private source or diagnostic logs
        working-directory: source
        run: |
          if ! (npm ci --ignore-scripts && npm run check && npm run lint && npm run build) > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo '::error::Source build failed. Reproduce the pinned source locally for private diagnostics.'
            exit 1
          fi
          mkdir -p ../release-output
          for file in main.js manifest.json styles.css; do
            test -f "$file" && test ! -L "$file"
            cp "$file" "../release-output/$file"
          done
      - name: Verify existing release bytes before generating proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/existing-release" --pattern main.js --pattern manifest.json --pattern styles.css
            for file in main.js manifest.json styles.css; do
              cmp "release-output/$file" "$RUNNER_TEMP/existing-release/$file"
            done
          fi
      - name: Generate public build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-output/main.js
            release-output/manifest.json
            release-output/styles.css
      - name: Verify persisted provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "release-output/$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish verified installation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LINBSYNC $RELEASE_VERSION" --notes 'Download main.js, manifest.json and styles.css together. See the README for installation and sign-in.' --draft
            gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" release-output/main.js release-output/manifest.json release-output/styles.css
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Record public verification details
        run: |
          echo "Built LINB-DEV/SYNC-SOURCE tag $RELEASE_VERSION at $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified public artifact attestations for all three installation files.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum release-output/main.js release-output/manifest.json release-output/styles.css >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private runner data
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/source"
          rm -f -- "$RUNNER_TEMP/private-build.log"
